name: Build debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Embed gesture typing library
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          curl -L -f --retry 3 -o app/src/main/jniLibs/arm64-v8a/libjni_latinimegoogle.so \
            https://github.com/Helium314/HeliBoard/raw/gh-pages/libraries/arm64-v8a/libjni_latinimegoogle.so || true
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build with Gradle
        run: ./gradlew assembleDebug
      - name: Rename APK to C-Thru
        run: |
          mkdir -p output_apk
          find app/build/outputs/apk/debug/ -name "*.apk" -exec cp {} output_apk/C-Thru-debug.apk \;
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: C-Thru-debug
          path: output_apk/C-Thru-debug.apk
